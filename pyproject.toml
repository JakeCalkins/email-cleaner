[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailzero"
version = "0.1.0"
description = "Lightweight CLI for inbox-zero workflows on macOS Mail"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"

[project.scripts]
mailzero = "mailzero.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
